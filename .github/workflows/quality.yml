name: Qualidade

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned dependencies and linter
        run: python -m pip install -r requirements.txt ruff==0.17.0
      - name: Compile
        run: python -m py_compile openUrl.py
      - name: Lint
        run: ruff check openUrl.py
