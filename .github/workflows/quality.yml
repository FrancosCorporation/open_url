name: Qualidade

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned dependencies and linter
        run: python -m pip install -r requirements.txt ruff==0.17.0
      - name: Compile
        run: python -m py_compile openUrl.py
      - name: Lint
        run: ruff check openUrl.py
